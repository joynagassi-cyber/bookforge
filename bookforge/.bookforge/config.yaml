# BookForge System Configuration
# Auto-generated by bookforge-framework installer
# Do not edit manually - use `bookforge configure` instead

framework:
  id: "bookforge"
  version: "2.2.0"
  mode: "artifact-first"
  platform_agnostic: true

# Project identity
project:
  name: ""
  type: "book"  # book, manuscript, portfolio
  template: "book"
  created_at: null
  updated_at: null

# Host configuration
host:
  detected: null  # claude-code, cursor, windsurf, generic, etc.
  capabilities: []
  installation: {}

# Graph configuration
graph:
  provider: "jsonl"  # none, jsonl, neo4j
  sync_mode: "event-driven"
  canonical_store: "files"
  graph_is_projection: true

# Context engineering
context:
  progressive_disclosure: true
  default_budget: "medium"  # small, medium, large
  compaction_threshold: 0.75
  canonical_state_dir: "bookforge/state"

# Scale-adaptive execution
routing:
  scale_adaptive: true
  min_scale: "tiny"
  max_scale: "book-scale"

# Quality gates
quality:
  require_human_gate_before_release: true
  fail_on_unresolved_critical_findings: true
  validators:
    - ai-slop-detector
    - cliche-detector
    - continuity-checker
    - fact-checker
    - originality-audit

# Knowledge system
knowledge:
  master_catalog: "knowledge/master/bookforge-knowledge-catalog-master-v1.0.json"
  catalog_directory: "knowledge/catalogs"
  index_directory: "knowledge/indexes"
  source_registry: "knowledge/sources/registry.json"
  progressive_disclosure: true
  deterministic_indexes: true

# Plugin system
plugins:
  registry: "bookforge/plugins/registry.json"
  manifest_schema: "specs/plugins/plugin.schema.json"

# Host adapters
hosts:
  adapter_spec: "specs/hosts/host-adapters.json"

# Paper trail (immutable decision log)
papertrail:
  enabled: true
  directory: ".bookforge/decisions"
  format: "markdown"
  append_only: true

# Phase governance
phases:
  current: null
  transitions:
    allowed: true
    require_validation: true
  gates:
    upstream_ready:
      required: ["book-contract.md", "outline.md"]
    downstream_ready:
      required: ["chapter.md", "validator-report.json"]
    release_ready:
      required: ["release-report.json", "human-approval.json"]
