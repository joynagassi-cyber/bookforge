# BookForge Module Assets
# Definition file for BookForge installer configuration

# Module metadata
code: "bf"
name: "BookForge"
description: "Context Engineering Framework for AI-Assisted Book Creation"
module_version: "1.0.0"
default_selected: true
module_greeting: >
  BookForge installer ready! Configuring your book production framework...

# Core configuration variables
project_name:
  prompt: "Project name (e.g., 'My Novel', 'Technical Guide'):"
  default: ""
  result: "{project-root}/{value}"

template:
  prompt: "Project template (book/manuscript/portfolio):"
  default: "book"
  result: "{value}"

host:
  prompt: "Target host (auto/claude-code/cursor/all):"
  default: "auto"
  result: "{value}"

graph_provider:
  prompt: "Graph provider (none/jsonl/neo4j):"
  default: "none"
  result: "{value}"

# Runtime configuration
progressive_disclosure:
  prompt: "Enable progressive context disclosure (yes/no):"
  default: "true"
  result: "{value}"

default_budget:
  prompt: "Default context budget (small/medium/large):"
  default: "medium"
  result: "{value}"

# Quality configuration
require_human_gate:
  prompt: "Require human gate before release (yes/no):"
  default: "true"
  result: "{value}"

fail_on_critical:
  prompt: "Fail on unresolved critical findings (yes/no):"
  default: "true"
  result: "{value}"

# Output configuration
output_folder:
  prompt: "Output folder for generated artifacts:"
  default: "{project-root}/bookforge-output"
  result: "{value}"
