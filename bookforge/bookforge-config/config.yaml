communication_language: English
document_output_language: English
graph:
  canonical_store: files
  graph_is_projection: true
  provider: none
  sync_mode: event-driven
graph_provider: none
host: auto
hosts:
  adapter_spec: specs/hosts/host-adapters.json
knowledge:
  catalog_directory: knowledge/catalogs
  deterministic_indexes: true
  index_directory: knowledge/indexes
  master_catalog: knowledge/master/bookforge-knowledge-catalog-master-v1.0.json
  progressive_disclosure: true
  source_registry: knowledge/sources/registry.json
modules:
  bf:
    default_budget: medium
    fail_on_critical: 'true'
    progressive_disclosure: 'true'
    require_human_gate: 'true'
output_folder: '{project-root}/bookforge-output'
plugins:
  manifest_schema: specs/plugins/plugin.schema.json
  registry: bookforge/plugins/registry.json
project_name: Test Book
quality:
  fail_on_unresolved_critical_findings: true
  require_human_gate_before_release: true
runtime:
  canonical_state_dir: bookforge/state
  compaction_threshold: 0.75
  default_budget: medium
  progressive_disclosure: true
template: book
user_name: Test User
